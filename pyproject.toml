[project]
name = "service-template"
version = "0.1.0"
description = "Шаблон сервиса бэкенда Tusumba"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "faststream[rabbit]>=0.6,<0.7",
    "apscheduler>=3.11,<4",
    "tusumba-common @ git+https://github.com/tusumba/tusumba-common.git@v0.3.0",
    "tusumba-contracts @ git+https://github.com/tusumba/tusumba-contracts.git@v0.1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx2>=2.0",
    "testcontainers[postgres]>=4.8",
    "testcontainers[rabbitmq]>=4.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error",
    "ignore:The @wait_container_is_ready decorator is deprecated:DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# В tusumba-common нет py.typed: проверяем её по аннотациям в исходниках.
[[tool.mypy.overrides]]
module = ["tusumba_common", "tusumba_common.*"]
follow_untyped_imports = true

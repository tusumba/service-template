x-service: &service
  build: .
  image: service-template:local
  environment:
    SERVICE_NAME: service_template
    ENVIRONMENT: local
    DATABASE_URL: postgresql+asyncpg://tusumba:tusumba@postgres:5432/tusumba
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tusumba
      POSTGRES_PASSWORD: tusumba
      POSTGRES_DB: tusumba
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tusumba -d tusumba"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *service
    command: ["alembic", "upgrade", "head"]

  app:
    <<: *service
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
